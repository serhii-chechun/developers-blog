services:
  server:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=storage
      - POSTGRES_PORT=5432
    depends_on:
      storage:
        condition: service_healthy

  storage:
    environment:
     - POSTGRES_USER=booking_api
     - POSTGRES_PASSWORD=booking_api
     - POSTGRES_DB=booking_api
    restart: always
    image: postgres:latest
    volumes:
      - booking_api_storage:/var/lib/postgresql
      - ./specs/postgres.sql:/docker-entrypoint-initdb.d/postgres.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booking_api_storage: